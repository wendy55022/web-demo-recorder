<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>cookie 提示測試頁</title>
<style>body{font-family:"Microsoft JhengHei",sans-serif;margin:24px;background:#f6f4ee;color:#222}
#cookie-banner{position:fixed;left:0;right:0;bottom:0;background:#222;color:#fff;padding:16px;display:flex;gap:12px;align-items:center}
#cookie-banner button{padding:8px 14px}.email{background:#fff;padding:8px;border:1px solid #ccc}</style></head>
<body>
<h1>測試頁</h1>
<p>這頁是 web-demo-recorder 的測試：開頁時有一條假的 cookie 提示，錄影開始前要自動被關掉。</p>
<p class="email">聯絡信箱：test-user@example.com（這格要被模糊）</p>
<button id="btn" onclick="document.getElementById('msg').textContent='按到了！'">按我</button>
<p id="msg"></p>
<input id="q" placeholder="打字測試" style="font-size:18px;padding:6px">
<div style="height:1200px"></div><p id="end">頁尾</p>
<div id="cookie-banner">本網站使用 Cookie 提升體驗。<button>設定</button><button onclick="this.parentNode.remove()">全部接受</button></div>
</body></html>
